services:
  tyrekick:
    build: .
    # Or, once you publish an image somewhere:
    # image: ghcr.io/<you>/tyrekick-self-hosted:latest
    ports:
      - "8080:8080"
    environment:
      TYREKICK_TOKEN: ${TYREKICK_TOKEN:?set TYREKICK_TOKEN in .env or the environment}
      # Optional integrations — uncomment and set to enable:
      # DISCORD_WEBHOOK: ${DISCORD_WEBHOOK}
      # TYREKICK_REVIEW_KEY: ${TYREKICK_REVIEW_KEY}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # AI_DAILY_CAP: "500"
      # Rate limiting (per IP). 0 disables either one.
      # INGEST_RATE_LIMIT: "15"
      # INGEST_RATE_PERIOD_SECONDS: "60"
      # READ_RATE_LIMIT: "120"
      # READ_RATE_PERIOD_SECONDS: "60"
    volumes:
      # A named volume so the SQLite file survives container recreation and
      # gets the right ownership automatically (see README for the
      # bind-mount alternative and its permissions caveat).
      - tyrekick-data:/data
    restart: unless-stopped

volumes:
  tyrekick-data:
