name: Test

# Runs on every PR and every push to main, so a merge can't land red.
#
# The `tyrekick` job is deliberately the same five steps as the package's
# `prepublishOnly` — CI and publish assert the same thing, so a PR that goes
# green cannot fail at publish time. Keep them in step if either changes.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tyrekick:
    name: widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # check:clean greps tracked files, so it needs the checkout, not the build.
      - run: npm run check:clean
      - run: npm run typecheck
      - run: npm run build
      - run: npm run size
      - run: npm test

  mcp:
    name: mcp server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

  self-hosted:
    name: self-hosted destination
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: destinations/self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Keep in step with the `go` directive in go.mod and the builder
          # image in the Dockerfile.
          go-version: "1.25"
          cache-dependency-path: destinations/self-hosted/go.sum

      # Formatting is a build failure, not a review comment.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      # A go.mod that isn't tidy hides direct dependencies among the indirect
      # ones, so `go mod tidy` must be a no-op on a green branch.
      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go vet ./...

      # -race because the Discord tee and the AI acknowledgement both run
      # detached from the request that started them.
      - run: go test -race ./...

      # The image is the deliverable, so build it here rather than finding out
      # at deploy time.
      - name: docker build
        run: docker build -t tyrekick-self-hosted:ci .
